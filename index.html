<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>CyberFinance AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      background: transparent !important;
    }

    /* MindAR injects the camera video into the document */
    video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: cover !important;
      transform: none !important;
    }

    .a-canvas, canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    .a-enter-vr, .a-enter-ar, .a-orientation-modal {
      display: none !important;
    }

    #hud {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      color: white;
      font-family: Arial, sans-serif;
    }

    #status {
      position: absolute;
      top: 4.5vh;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 18px;
      text-shadow: 0 2px 5px #000;
    }

    #hint {
      position: absolute;
      bottom: 5vh;
      left: 8vw;
      right: 8vw;
      text-align: center;
      font-size: 16px;
      text-shadow: 0 2px 5px #000;
    }

    #frame {
      position: absolute;
      left: 10vw;
      right: 10vw;
      top: 22vh;
      bottom: 22vh;
      border: 0;
    }

    .corner {
      position: absolute;
      width: 34px;
      height: 34px;
      border-color: rgba(255,255,255,.85);
      border-style: solid;
    }
    .tl { left:0; top:0; border-width:7px 0 0 7px; }
    .tr { right:0; top:0; border-width:7px 7px 0 0; }
    .bl { left:0; bottom:0; border-width:0 0 7px 7px; }
    .br { right:0; bottom:0; border-width:0 7px 7px 0; }

    .scanline {
      position:absolute;
      top:8px;
      left:0;
      right:0;
      height:5px;
      background:rgba(255,255,255,.8);
      box-shadow:0 0 12px rgba(255,255,255,.5);
      animation:scan 2.2s ease-in-out infinite alternate;
    }
    @keyframes scan {
      from { transform:translateY(0); }
      to { transform:translateY(calc(56vh - 20px)); }
    }

    body.found .scanline { display:none; }
  </style>
</head>

<body>
  <div id="hud">
    <div id="status">Iniciando cámara…</div>
    <div id="frame">
      <i class="corner tl"></i><i class="corner tr"></i>
      <i class="corner bl"></i><i class="corner br"></i>
      <div class="scanline"></div>
    </div>
    <div id="hint">Buscá que el toro ocupe buena parte de la pantalla.</div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: yes;"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="bullTarget" mindar-image-target="targetIndex: 0">
      <!-- Neon eye overlays; coordinates can be fine-tuned after the first tracking test. -->
      <a-circle position="-0.175 0.105 0.01" radius="0.055"
        material="color: #ffffff; emissive: #ff00ff; emissiveIntensity: 3; transparent: true; opacity: .72"
        animation="property: scale; from: 0.75 0.75 0.75; to: 1.25 1.25 1.25; dir: alternate; dur: 450; loop: true">
      </a-circle>
      <a-circle position="0.175 0.105 0.01" radius="0.055"
        material="color: #ffffff; emissive: #ff00ff; emissiveIntensity: 3; transparent: true; opacity: .72"
        animation="property: scale; from: 0.75 0.75 0.75; to: 1.25 1.25 1.25; dir: alternate; dur: 450; loop: true">
      </a-circle>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const target = document.querySelector('#bullTarget');
    const status = document.querySelector('#status');
    const hint = document.querySelector('#hint');

    scene.addEventListener('arReady', () => {
      status.textContent = 'Buscando el toro…';
    });

    scene.addEventListener('arError', () => {
      status.textContent = 'No pude iniciar la cámara';
      hint.textContent = 'Revisá el permiso de cámara de Chrome y recargá.';
    });

    target.addEventListener('targetFound', () => {
      document.body.classList.add('found');
      status.textContent = '✓ Toro detectado';
      hint.textContent = 'Mové el teléfono: el efecto debería quedar pegado a la imagen.';
    });

    target.addEventListener('targetLost', () => {
      document.body.classList.remove('found');
      status.textContent = 'Buscando el toro…';
      hint.textContent = 'Volvé a encuadrar la imagen completa.';
    });
  </script>
</body>
</html>
