<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CyberFinance AR Glitch</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

video{
  position:fixed!important;
  inset:0!important;
  width:100vw!important;
  height:100vh!important;
  max-width:none!important;
  max-height:none!important;
  object-fit:cover!important;
}

canvas,.a-canvas{
  position:fixed!important;
  inset:0!important;
  width:100vw!important;
  height:100vh!important;
}

.a-enter-vr,
.a-enter-ar,
.a-enter-vr-button,
.a-orientation-modal{
  display:none!important;
  visibility:hidden!important;
}

/* Overlay inicial para desbloquear audio en móviles */
#soundGate{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(4px);
}

#soundGate button{
  border:0;
  border-radius:14px;
  padding:16px 22px;
  font:600 18px Arial,sans-serif;
  cursor:pointer;
}

#soundGate.hidden{
  display:none;
}
</style>
</head>

<body>

<div id="soundGate">
  <button id="startExperience">Iniciar experiencia</button>
</div>

<audio
  id="glitchSound"
  src="./glitch-interference.wav"
  preload="auto">
</audio>

<a-scene
  id="scene"
  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: true;
    uiLoading: no;
    uiScanning: no;
    uiError: yes;
    filterMinCF: 0.0001;
    filterBeta: 0.01;
    warmupTolerance: 5;
    missTolerance: 5;
  "
  embedded
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true;antialias:true;colorManagement:true;precision:high"
>

<a-assets>
  <img id="targetImage" src="./target.png" crossorigin="anonymous">
</a-assets>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity id="bullTarget" mindar-image-target="targetIndex:0">

  <a-plane
    id="glitchPlane"
    position="0 0 0.03"
    width="1"
    height="1.28643216"
    visible="false"
    material="shader:flat;transparent:true;side:double;depthTest:false"
  ></a-plane>

</a-entity>

</a-scene>

<script>
const TARGET_W = 1592;
const TARGET_H = 2048;

/* tiempos */
const WAIT_MS   = 500;   // espera desde que detecta
const GLITCH_MS = 1100;  // duración del glitch
const REPEAT_MS = 700;   // pausa normal antes del siguiente glitch

const target       = document.querySelector("#bullTarget");
const plane        = document.querySelector("#glitchPlane");
const image        = document.querySelector("#targetImage");
const scene        = document.querySelector("#scene");
const glitchSound  = document.querySelector("#glitchSound");

const soundGate        = document.querySelector("#soundGate");
const startExperience  = document.querySelector("#startExperience");

let targetVisible = false;
let waitTimer = null;
let repeatTimer = null;
let raf = null;
let audioUnlocked = false;


/* =========================================================
   DESBLOQUEO DE AUDIO EN ANDROID / IOS
   ========================================================= */

startExperience.addEventListener("click", async () => {
  try {
    glitchSound.volume = 0;
    await glitchSound.play();
    glitchSound.pause();
    glitchSound.currentTime = 0;
    glitchSound.volume = 1;
    audioUnlocked = true;
  } catch (e) {
    console.warn("No pude desbloquear audio:", e);
  }

  soundGate.classList.add("hidden");
});


/* =========================================================
   CANVAS DEL GLITCH
   ========================================================= */

const glitchCanvas = document.createElement("canvas");
glitchCanvas.width  = TARGET_W;
glitchCanvas.height = TARGET_H;

const ctx = glitchCanvas.getContext("2d", { alpha:true });

ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = "high";

let texture = null;


/* =========================================================
   TEXTURA THREE
   ========================================================= */

function createTexture() {

  const mesh = plane.getObject3D("mesh");

  if (!mesh) {
    requestAnimationFrame(createTexture);
    return;
  }

  texture = new THREE.CanvasTexture(glitchCanvas);

  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.generateMipmaps = false;
  texture.needsUpdate = true;

  mesh.material.map = texture;
  mesh.material.transparent = true;
  mesh.material.needsUpdate = true;
}


/* =========================================================
   DIBUJA GLITCH FUERTE
   ========================================================= */

function renderGlitch(progress) {

  const envelope = Math.sin(progress * Math.PI);
  const power = Math.pow(envelope, 0.55);

  ctx.clearRect(0, 0, TARGET_W, TARGET_H);

  /* pequeña sacudida de imagen completa */
  const baseX = (Math.random() - 0.5) * 28 * power;
  const baseY = (Math.random() - 0.5) * 16 * power;

  ctx.drawImage(
    image,
    baseX,
    baseY,
    TARGET_W,
    TARGET_H
  );


  /* cortes horizontales */
  const slices = Math.floor(8 + 42 * power);

  for (let i = 0; i < slices; i++) {

    const y = Math.random() * TARGET_H;
    const h = 4 + Math.random() * (25 + 100 * power);

    const maxShift = 60 + 320 * power;
    const shift = (Math.random() - 0.5) * maxShift;

    ctx.drawImage(
      image,
      0, y,
      TARGET_W, h,
      shift, y,
      TARGET_W, h
    );
  }


  /* bloques desplazados */
  const blocks = Math.floor(3 + 16 * power);

  for (let i = 0; i < blocks; i++) {

    const sx = Math.random() * TARGET_W;
    const sy = Math.random() * TARGET_H;

    const sw = 80 + Math.random() * 500;
    const sh = 20 + Math.random() * 180;

    const dx = sx + (Math.random() - 0.5) * 260 * power;
    const dy = sy + (Math.random() - 0.5) * 80 * power;

    ctx.drawImage(
      image,
      sx, sy, sw, sh,
      dx, dy, sw, sh
    );
  }


  /* RGB split */
  if (power > 0.12) {

    ctx.save();

    ctx.globalCompositeOperation = "screen";

    const rgbShift = 10 + 45 * power;

    ctx.globalAlpha = 0.16 + 0.18 * power;
    ctx.filter = "hue-rotate(155deg) saturate(2.8)";

    ctx.drawImage(
      image,
      -rgbShift,
      0,
      TARGET_W,
      TARGET_H
    );

    ctx.globalAlpha = 0.13 + 0.16 * power;
    ctx.filter = "hue-rotate(300deg) saturate(3)";

    ctx.drawImage(
      image,
      rgbShift,
      0,
      TARGET_W,
      TARGET_H
    );

    ctx.restore();
  }


  /* flashes */
  if (Math.random() < 0.38 * power) {

    ctx.fillStyle =
      `rgba(255,255,255,${0.05 + 0.12 * power})`;

    ctx.fillRect(
      0,
      0,
      TARGET_W,
      TARGET_H
    );
  }


  /* líneas cyan / magenta */
  const lines = Math.floor(2 + 18 * power);

  for (let i = 0; i < lines; i++) {

    const y = Math.random() * TARGET_H;
    const h = 2 + Math.random() * 15;

    ctx.fillStyle =
      Math.random() > 0.5
        ? `rgba(0,255,255,${0.2 + 0.45 * power})`
        : `rgba(255,0,220,${0.2 + 0.45 * power})`;

    ctx.fillRect(
      Math.random() * TARGET_W * 0.15,
      y,
      TARGET_W * (0.55 + Math.random() * 0.45),
      h
    );
  }


  /* shake del plano completo */
  const shakeX =
    (Math.random() - 0.5) * 0.035 * power;

  const shakeY =
    (Math.random() - 0.5) * 0.025 * power;

  plane.setAttribute(
    "position",
    `${shakeX} ${shakeY} 0.03`
  );


  const sx =
    1 + (Math.random() - 0.5) * 0.055 * power;

  const sy =
    1 + (Math.random() - 0.5) * 0.035 * power;

  plane.setAttribute(
    "scale",
    `${sx} ${sy} 1`
  );


  if (texture) {
    texture.needsUpdate = true;
  }
}


/* =========================================================
   AUDIO
   ========================================================= */

function playGlitchSound() {

  if (!audioUnlocked) return;

  try {
    glitchSound.pause();
    glitchSound.currentTime = 0;
    glitchSound.volume = 1;

    const promise = glitchSound.play();

    if (promise) {
      promise.catch(err => {
        console.warn("Audio bloqueado:", err);
      });
    }

  } catch (e) {
    console.warn(e);
  }
}


function stopGlitchSound() {

  try {
    glitchSound.pause();
    glitchSound.currentTime = 0;
  } catch (_) {}
}


/* =========================================================
   INICIA GLITCH
   ========================================================= */

function startGlitch() {

  if (!targetVisible) return;

  plane.setAttribute(
    "visible",
    true
  );

  /* audio y glitch empiezan juntos */
  playGlitchSound();

  const start = performance.now();


  function animate(now) {

    if (!targetVisible) {
      stopGlitch();
      return;
    }

    const elapsed =
      now - start;

    const progress =
      Math.min(
        elapsed / GLITCH_MS,
        1
      );


    renderGlitch(
      progress
    );


    if (progress < 1) {

      raf =
        requestAnimationFrame(
          animate
        );

    } else {

      stopGlitch();

      clearTimeout(
        repeatTimer
      );


      repeatTimer =
        setTimeout(
          () => {

            if (targetVisible) {
              startGlitch();
            }

          },
          REPEAT_MS
        );

    }

  }


  raf =
    requestAnimationFrame(
      animate
    );
}


/* =========================================================
   DETIENE GLITCH
   ========================================================= */

function stopGlitch() {

  if (raf) {

    cancelAnimationFrame(
      raf
    );

    raf = null;
  }


  plane.setAttribute(
    "visible",
    false
  );


  plane.setAttribute(
    "position",
    "0 0 0.03"
  );


  plane.setAttribute(
    "scale",
    "1 1 1"
  );


  stopGlitchSound();
}


/* =========================================================
   TARGET DETECTADO
   ========================================================= */

target.addEventListener(
  "targetFound",
  () => {

    if (targetVisible) return;

    targetVisible = true;


    clearTimeout(
      waitTimer
    );

    clearTimeout(
      repeatTimer
    );


    stopGlitch();


    waitTimer =
      setTimeout(
        () => {

          if (targetVisible) {
            startGlitch();
          }

        },
        WAIT_MS
      );

  }
);


/* =========================================================
   TARGET PERDIDO
   ========================================================= */

target.addEventListener(
  "targetLost",
  () => {

    targetVisible = false;


    clearTimeout(
      waitTimer
    );

    clearTimeout(
      repeatTimer
    );


    stopGlitch();

  }
);


/* =========================================================
   INIT
   ========================================================= */

plane.addEventListener(
  "loaded",
  () => {

    if (image.complete) {
      createTexture();
    } else {
      image.onload =
        createTexture;
    }

  }
);

</script>

</body>
</html>
