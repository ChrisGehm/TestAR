<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CyberFinance AR V3</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
video,.a-canvas,canvas{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important}
video{object-fit:cover!important}
.a-enter-vr,.a-enter-ar,.a-orientation-modal,.a-enter-vr-button{display:none!important;visibility:hidden!important}
#status{position:fixed;z-index:9999;top:3vh;left:50%;transform:translateX(-50%);padding:9px 15px;border-radius:20px;background:#0008;color:#fff;font:15px Arial;white-space:nowrap;pointer-events:none;transition:opacity .25s}
</style>
</head>
<body>
<div id="status">Iniciando cámara…</div>

<a-scene
 mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: yes;"
 embedded vr-mode-ui="enabled:false"
 device-orientation-permission-ui="enabled:false"
 renderer="alpha:true;antialias:true;colorManagement:true">

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity id="bull" mindar-image-target="targetIndex:0" visible="false">

  <!-- Ojos: núcleo pequeño + halos suaves, sin borde -->
  <a-circle position="-0.174 -0.035 .012" radius=".027"
    material="shader:flat;color:#fff;transparent:true;opacity:.92"
    animation="property:material.opacity;from:.48;to:1;dir:alternate;dur:260;loop:true"></a-circle>
  <a-circle position="-0.174 -0.035 .011" radius=".043"
    material="shader:flat;color:#ff20ed;transparent:true;opacity:.34"
    animation__s="property:scale;from:.72 .72 .72;to:1.38 1.38 1.38;dir:alternate;dur:430;loop:true"
    animation__o="property:material.opacity;from:.12;to:.48;dir:alternate;dur:430;loop:true"></a-circle>

  <a-circle position="0.166 -0.035 .012" radius=".027"
    material="shader:flat;color:#fff;transparent:true;opacity:.92"
    animation="property:material.opacity;from:.48;to:1;dir:alternate;dur:260;loop:true"></a-circle>
  <a-circle position="0.166 -0.035 .011" radius=".043"
    material="shader:flat;color:#ff20ed;transparent:true;opacity:.34"
    animation__s="property:scale;from:.72 .72 .72;to:1.38 1.38 1.38;dir:alternate;dur:430;loop:true"
    animation__o="property:material.opacity;from:.12;to:.48;dir:alternate;dur:430;loop:true"></a-circle>

  <!-- Glitches: inicialmente invisibles; JS los dispara en ráfagas -->
  <a-entity id="glitches" visible="false">
    <a-plane position="-.26 .18 .02" width=".24" height=".009" material="shader:flat;color:#00ffff;transparent:true;opacity:.78"></a-plane>
    <a-plane position=".27 .10 .021" width=".30" height=".008" material="shader:flat;color:#ff00d9;transparent:true;opacity:.72"></a-plane>
    <a-plane position="-.19 -.16 .022" width=".18" height=".007" material="shader:flat;color:#3957ff;transparent:true;opacity:.76"></a-plane>
  </a-entity>

  <!-- "Humo" digital: partículas semitransparentes desde las fosas -->
  <a-circle position="-.058 -.245 .026" radius=".014"
    material="shader:flat;color:#00ffff;transparent:true;opacity:.52"
    animation__p="property:position;from:-.058 -.245 .026;to:-.13 -.39 .07;dur:850;loop:true"
    animation__s="property:scale;from:.3 .3 .3;to:2.7 2.7 2.7;dur:850;loop:true"
    animation__o="property:material.opacity;from:.55;to:0;dur:850;loop:true"></a-circle>
  <a-circle position=".058 -.245 .026" radius=".014"
    material="shader:flat;color:#ff00d9;transparent:true;opacity:.52"
    animation__p="property:position;from:.058 -.245 .026;to:.13 -.39 .07;dur:980;loop:true"
    animation__s="property:scale;from:.3 .3 .3;to:2.7 2.7 2.7;dur:980;loop:true"
    animation__o="property:material.opacity;from:.55;to:0;dur:980;loop:true"></a-circle>

  <a-circle position="-.035 -.25 .024" radius=".010"
    material="shader:flat;color:#fff;transparent:true;opacity:.4"
    animation__p="property:position;from:-.035 -.25 .024;to:-.02 -.43 .06;dur:1250;loop:true"
    animation__s="property:scale;from:.2 .2 .2;to:3 3 3;dur:1250;loop:true"
    animation__o="property:material.opacity;from:.4;to:0;dur:1250;loop:true"></a-circle>
</a-entity>
</a-scene>

<script>
const scene=document.querySelector('a-scene');
const bull=document.querySelector('#bull');
const status=document.querySelector('#status');
const glitches=document.querySelector('#glitches');
let glitchTimer=null;

function glitchBurst(){
  if(!bull.object3D.visible) return;
  glitches.setAttribute('visible',true);
  setTimeout(()=>glitches.setAttribute('visible',false),110);
  glitchTimer=setTimeout(glitchBurst,900+Math.random()*2300);
}

scene.addEventListener('arReady',()=>status.textContent='Buscando el toro…');
scene.addEventListener('arError',()=>status.textContent='Error de cámara');

bull.addEventListener('targetFound',()=>{
  bull.setAttribute('visible',true);
  status.textContent='✓ Toro detectado';
  setTimeout(()=>status.style.opacity='0',650);
  clearTimeout(glitchTimer);
  glitchTimer=setTimeout(glitchBurst,450);
});

bull.addEventListener('targetLost',()=>{
  bull.setAttribute('visible',false);
  glitches.setAttribute('visible',false);
  clearTimeout(glitchTimer);
  status.style.opacity='1';
  status.textContent='Buscando el toro…';
});
</script>
</body>
</html>
