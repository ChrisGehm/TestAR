<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CyberFinance AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
video,.a-canvas,canvas{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important}
video{object-fit:cover!important}
.a-enter-vr,.a-enter-ar,.a-orientation-modal,.a-enter-vr-button{display:none!important;visibility:hidden!important}
#status{position:fixed;z-index:9999;top:3vh;left:50%;transform:translateX(-50%);padding:9px 15px;border-radius:20px;background:#0008;color:#fff;font:15px Arial;white-space:nowrap;pointer-events:none;transition:opacity .25s}
</style></head><body>
<div id="status">Iniciando cámara…</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: yes;"
 embedded vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false"
 renderer="alpha:true;antialias:true;colorManagement:true">
<a-assets><img id="fx" src="./effects-overlay.png"></a-assets>
<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity id="bull" mindar-image-target="targetIndex:0">
  <!-- exact-aspect transparent overlay; target width is normalized to 1 -->
  <a-plane id="overlay" src="#fx" transparent="true"
    position="0 0 .012" width="1" height="1.28643216"
    material="shader:flat;transparent:true;opacity:0;alphaTest:0.01"
    animation__fade="property:material.opacity;from:.22;to:.95;dir:alternate;dur:520;loop:true;easing:easeInOutSine">
  </a-plane>

  <!-- smoke is deliberately soft and small, anchored near original nostrils -->
  <a-circle position="-.095 -.205 .025" radius=".013"
    material="shader:flat;color:#00eaff;transparent:true;opacity:.35"
    animation__p="property:position;from:-.095 -.205 .025;to:-.16 -.34 .06;dur:950;loop:true"
    animation__s="property:scale;from:.25 .25 .25;to:2.8 2.8 2.8;dur:950;loop:true"
    animation__o="property:material.opacity;from:.4;to:0;dur:950;loop:true"></a-circle>
  <a-circle position=".055 -.205 .025" radius=".013"
    material="shader:flat;color:#ff20df;transparent:true;opacity:.35"
    animation__p="property:position;from:.055 -.205 .025;to:.12 -.34 .06;dur:1100;loop:true"
    animation__s="property:scale;from:.25 .25 .25;to:2.8 2.8 2.8;dur:1100;loop:true"
    animation__o="property:material.opacity;from:.4;to:0;dur:1100;loop:true"></a-circle>
</a-entity></a-scene>
<script>
const s=document.querySelector('#status'), scene=document.querySelector('a-scene'), bull=document.querySelector('#bull');
scene.addEventListener('arReady',()=>s.textContent='Buscando el toro…');
scene.addEventListener('arError',()=>s.textContent='Error de cámara');
bull.addEventListener('targetFound',()=>{s.textContent='✓ Toro detectado';setTimeout(()=>s.style.opacity='0',500);});
bull.addEventListener('targetLost',()=>{s.style.opacity='1';s.textContent='Buscando el toro…';});
</script></body></html>
