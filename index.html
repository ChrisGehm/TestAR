<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CyberFinance AR Glitch</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

video{
  position:fixed!important;
  inset:0!important;
  width:100vw!important;
  height:100vh!important;
  max-width:none!important;
  max-height:none!important;
  object-fit:cover!important;
}

canvas,.a-canvas{
  position:fixed!important;
  inset:0!important;
  width:100vw!important;
  height:100vh!important;
}

.a-enter-vr,.a-enter-ar,.a-enter-vr-button,.a-orientation-modal{
  display:none!important;
  visibility:hidden!important;
}
</style>
</head>

<body>

<a-scene
  id="scene"
  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: true;
    uiLoading: no;
    uiScanning: no;
    uiError: yes;
    filterMinCF: 0.0001;
    filterBeta: 0.01;
    warmupTolerance: 5;
    missTolerance: 5;
  "
  embedded
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true;antialias:true;colorManagement:true;precision:high"
>

<a-assets>
  <img id="targetImage" src="./target.png" crossorigin="anonymous">
</a-assets>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity id="bullTarget" mindar-image-target="targetIndex:0">

  <a-plane
    id="glitchPlane"
    position="0 0 0.03"
    width="1"
    height="1.28643216"
    visible="false"
    material="shader:flat;transparent:true;side:double;depthTest:false"
  ></a-plane>

</a-entity>

</a-scene>

<script>
const TARGET_W = 1592;
const TARGET_H = 2048;

const WAIT_MS   = 500;
const GLITCH_MS = 1100;
const REPEAT_MS = 700;

const target = document.querySelector("#bullTarget");
const plane  = document.querySelector("#glitchPlane");
const image  = document.querySelector("#targetImage");
const scene  = document.querySelector("#scene");

let visible = false;
let waitTimer = null;
let repeatTimer = null;
let raf = null;

const canvas = document.createElement("canvas");
canvas.width  = TARGET_W;
canvas.height = TARGET_H;

const ctx = canvas.getContext("2d", {alpha:true});
let texture = null;


/* =========================================================
   INTENTA SUBIR LA RESOLUCIÓN REAL DE LA CÁMARA
   ========================================================= */

async function improveCameraQuality() {
  try {
    const video = [...document.querySelectorAll("video")]
      .find(v => v.srcObject instanceof MediaStream);

    if (!video) {
      setTimeout(improveCameraQuality, 400);
      return;
    }

    const track = video.srcObject.getVideoTracks()[0];
    if (!track) return;

    const caps = track.getCapabilities ? track.getCapabilities() : {};

    const constraints = {
      width:  { ideal: 1920 },
      height: { ideal: 1080 },
      frameRate: { ideal: 30, max: 30 }
    };

    if (caps.focusMode?.includes("continuous")) {
      constraints.focusMode = "continuous";
    }

    await track.applyConstraints(constraints);

    const settings = track.getSettings();
    console.log("Camera:", settings.width, "x", settings.height, settings.frameRate);
  } catch (e) {
    console.warn("No se pudieron aplicar constraints HD:", e);
  }
}

scene.addEventListener("arReady", () => {
  setTimeout(improveCameraQuality, 250);
});


/* =========================================================
   TEXTURA CANVAS -> THREE
   ========================================================= */

function initTexture() {
  const mesh = plane.getObject3D("mesh");

  if (!mesh) {
    requestAnimationFrame(initTexture);
    return;
  }

  texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.generateMipmaps = false;

  mesh.material.map = texture;
  mesh.material.transparent = true;
  mesh.material.needsUpdate = true;
}


/* =========================================================
   GLITCH FUERTE
   ========================================================= */

function renderGlitch(progress) {

  // 0 -> 1 -> 0
  const envelope = Math.sin(progress * Math.PI);

  // se vuelve mucho más agresivo en el centro
  const power = Math.pow(envelope, 0.55);

  ctx.clearRect(0,0,TARGET_W,TARGET_H);

  /*
    Base ligeramente desplazada.
    Así nunca parece una imagen simplemente estática.
  */
  const baseX = (Math.random() - .5) * 28 * power;
  const baseY = (Math.random() - .5) * 16 * power;

  ctx.drawImage(
    image,
    baseX,
    baseY,
    TARGET_W,
    TARGET_H
  );


  /* -----------------------------
     CORTES HORIZONTALES GRANDES
     ----------------------------- */

  const slices = Math.floor(8 + 42 * power);

  for (let i=0; i<slices; i++) {

    const y = Math.random() * TARGET_H;
    const h = 4 + Math.random() * (25 + 100 * power);

    const maxShift = 60 + 320 * power;
    const shift = (Math.random() - .5) * maxShift;

    ctx.drawImage(
      image,
      0, y,
      TARGET_W, h,
      shift, y,
      TARGET_W, h
    );
  }


  /* -----------------------------
     BLOQUES DE DISTORSIÓN
     ----------------------------- */

  const blocks = Math.floor(3 + 16 * power);

  for (let i=0; i<blocks; i++) {

    const sx = Math.random() * TARGET_W;
    const sy = Math.random() * TARGET_H;

    const sw = 80 + Math.random() * 500;
    const sh = 20 + Math.random() * 180;

    const dx = sx + (Math.random() - .5) * 260 * power;
    const dy = sy + (Math.random() - .5) * 80 * power;

    ctx.drawImage(
      image,
      sx, sy, sw, sh,
      dx, dy, sw, sh
    );
  }


  /* -----------------------------
     RGB SPLIT MÁS MARCADO
     ----------------------------- */

  if (power > .12) {

    ctx.save();
    ctx.globalCompositeOperation = "screen";

    const rgbShift = 10 + 45 * power;

    ctx.globalAlpha = .16 + .18 * power;
    ctx.filter = "hue-rotate(155deg) saturate(2.8)";
    ctx.drawImage(image, -rgbShift, 0, TARGET_W, TARGET_H);

    ctx.globalAlpha = .13 + .16 * power;
    ctx.filter = "hue-rotate(300deg) saturate(3)";
    ctx.drawImage(image, rgbShift, 0, TARGET_W, TARGET_H);

    ctx.restore();
  }


  /* -----------------------------
     FLASH / RUIDO
     ----------------------------- */

  if (Math.random() < .38 * power) {
    ctx.fillStyle = `rgba(255,255,255,${0.05 + 0.12*power})`;
    ctx.fillRect(0,0,TARGET_W,TARGET_H);
  }

  const errorLines = Math.floor(2 + 18 * power);

  for (let i=0; i<errorLines; i++) {
    const y = Math.random() * TARGET_H;
    const hh = 2 + Math.random() * 15;

    ctx.fillStyle =
      Math.random() > .5
        ? `rgba(0,255,255,${.2 + .45*power})`
        : `rgba(255,0,220,${.2 + .45*power})`;

    ctx.fillRect(
      Math.random() * TARGET_W * .15,
      y,
      TARGET_W * (.55 + Math.random()*.45),
      hh
    );
  }


  /* -----------------------------
     SACUDIDA DEL PLANO ENTERO
     ----------------------------- */

  const shakeX = (Math.random() - .5) * .035 * power;
  const shakeY = (Math.random() - .5) * .025 * power;

  plane.setAttribute(
    "position",
    `${shakeX} ${shakeY} 0.03`
  );

  const sx = 1 + (Math.random()-.5) * .055 * power;
  const sy = 1 + (Math.random()-.5) * .035 * power;

  plane.setAttribute(
    "scale",
    `${sx} ${sy} 1`
  );

  texture.needsUpdate = true;
}


/* =========================================================
   SECUENCIA
   ========================================================= */

function startGlitch() {

  if (!visible) return;

  plane.setAttribute("visible", true);

  const start = performance.now();

  function animate(now) {

    if (!visible) {
      stopGlitch();
      return;
    }

    const elapsed = now - start;
    const progress = Math.min(elapsed / GLITCH_MS, 1);

    renderGlitch(progress);

    if (progress < 1) {
      raf = requestAnimationFrame(animate);
    } else {
      stopGlitch();

      clearTimeout(repeatTimer);
      repeatTimer = setTimeout(() => {
        if (visible) startGlitch();
      }, REPEAT_MS);
    }
  }

  raf = requestAnimationFrame(animate);
}


function stopGlitch() {

  if (raf) {
    cancelAnimationFrame(raf);
    raf = null;
  }

  plane.setAttribute("visible", false);
  plane.setAttribute("position", "0 0 0.03");
  plane.setAttribute("scale", "1 1 1");
}


/* =========================================================
   TRACKING
   ========================================================= */

target.addEventListener("targetFound", () => {

  visible = true;

  clearTimeout(waitTimer);
  clearTimeout(repeatTimer);
  stopGlitch();

  waitTimer = setTimeout(() => {
    if (visible) startGlitch();
  }, WAIT_MS);
});


target.addEventListener("targetLost", () => {

  visible = false;

  clearTimeout(waitTimer);
  clearTimeout(repeatTimer);
  stopGlitch();
});


/* =========================================================
   INIT
   ========================================================= */

plane.addEventListener("loaded", () => {

  if (image.complete) {
    initTexture();
  } else {
    image.onload = initTexture;
  }

});

</script>
</body>
</html>
