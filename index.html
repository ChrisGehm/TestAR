<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CyberFinance AR Glitch</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#ar{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden}
#status{
  position:fixed;left:10px;bottom:10px;z-index:10000;
  padding:8px 10px;border-radius:8px;background:#000b;color:#8cff8c;
  font:12px monospace;pointer-events:none
}
canvas{background:transparent!important}
</style>
</head>

<body>
<div id="ar"></div>
<div id="status">Iniciando cámara…</div>

<script type="module">
import * as THREE from "three";
import { MindARThree } from "mindar-image-three";

const container = document.querySelector("#ar");
const status = document.querySelector("#status");

const mindarThree = new MindARThree({
  container,
  imageTargetSrc: "./targets.mind",
  maxTrack: 1,
  filterMinCF: 0.0001,
  filterBeta: 0.001
});

const {renderer, scene, camera} = mindarThree;
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));

const anchor = mindarThree.addAnchor(0);

/*
  Overlay de glitch. Usamos target.png como textura y shaders UV
  para que la distorsión ocurra enteramente en GPU.
*/
const texture = new THREE.TextureLoader().load("./target.png");
texture.colorSpace = THREE.SRGBColorSpace;

const uniforms = {
  map: {value:texture},
  time: {value:0},
  amount: {value:0}
};

const material = new THREE.ShaderMaterial({
  transparent:true,
  depthTest:false,
  depthWrite:false,
  uniforms,
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D map;
    uniform float time;
    uniform float amount;
    varying vec2 vUv;

    float hash(float n){return fract(sin(n)*43758.5453123);}

    void main(){
      vec2 uv=vUv;
      float row=floor(uv.y*32.0);
      float gate=step(0.55,hash(row+floor(time*24.0)));
      float shift=(hash(row*3.7+floor(time*30.0))-.5)*0.15*amount*gate;

      vec2 ur=uv+vec2( shift,0.0);
      vec2 ug=uv+vec2(-shift*.25,0.0);
      vec2 ub=uv+vec2(-shift,0.0);

      float r=texture2D(map,ur).r;
      float g=texture2D(map,ug).g;
      float b=texture2D(map,ub).b;
      float a=texture2D(map,uv).a;

      float scan=sin((uv.y*700.0)+(time*45.0))*.06*amount;
      gl_FragColor=vec4(vec3(r,g,b)+scan,a*amount);
    }
  `
});

/* Aspecto del PNG original: 1080x1350 aprox. */
const plane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1.25), material);
plane.position.z = 0.01;
anchor.group.add(plane);

let found=false;
let glitching=false;
let nextGlitch=0;
let glitchStart=0;

const WAIT=500;
const GLITCH=1100;
const GAP=700;

anchor.onTargetFound = () => {
  if(!found){
    found=true;
    nextGlitch=performance.now()+WAIT;
  }
};

anchor.onTargetLost = () => {
  found=false;
  glitching=false;
  uniforms.amount.value=0;
};

function updateGlitch(now){
  if(!found) return;

  if(!glitching && now>=nextGlitch){
    glitching=true;
    glitchStart=now;
  }

  if(glitching){
    const p=(now-glitchStart)/GLITCH;
    if(p>=1){
      glitching=false;
      uniforms.amount.value=0;
      nextGlitch=now+GAP;
    }else{
      // ataque rápido + variación intensa
      const envelope=Math.sin(Math.PI*Math.min(1,p*1.15));
      uniforms.amount.value=Math.min(1,0.45+envelope*0.75);
      uniforms.time.value=now/1000;
    }
  }
}

async function start(){
  try{
    /*
      MindAR Three.js oficial. Antes de start() parcheamos getUserMedia
      para que SU solicitud inicial nazca con constraints HD en Android.
    */
    const md=navigator.mediaDevices;
    const original=md.getUserMedia.bind(md);

    md.getUserMedia=async (constraints={})=>{
      const c={...constraints};
      const existing=(c.video && c.video!==true)?c.video:{};
      c.video={
        ...existing,
        facingMode:{ideal:"environment"},
        width:{ideal:1920,min:1280},
        height:{ideal:1080,min:720},
        frameRate:{ideal:30,max:30}
      };
      return original(c);
    };

    await mindarThree.start();

    // Restore API immediately after MindAR owns the stream.
    md.getUserMedia=original;

    const videos=[...container.querySelectorAll("video")];
    const video=videos.find(v=>v.srcObject instanceof MediaStream) || videos[0];

    if(video && video.srcObject){
      const track=video.srcObject.getVideoTracks()[0];
      const s=track?.getSettings?.()||{};
      status.textContent=`Cámara real: ${s.width||video.videoWidth||"?"}×${s.height||video.videoHeight||"?"} @ ${Math.round(s.frameRate||0)}fps`;
    }else{
      status.textContent="AR iniciado";
    }

    renderer.setAnimationLoop(()=>{
      updateGlitch(performance.now());
      renderer.render(scene,camera);
    });

  }catch(e){
    console.error(e);
    status.textContent="Error: "+(e?.message||e);
  }
}

start();
</script>
</body>
</html>
