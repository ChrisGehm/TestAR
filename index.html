<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CyberFinance AR V2</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
video,.a-canvas,canvas{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important}
video{object-fit:cover!important}
.a-enter-vr,.a-enter-ar,.a-orientation-modal,.a-enter-vr-button{display:none!important;visibility:hidden!important}
#status{position:fixed;z-index:9999;top:3vh;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:24px;background:#0009;color:#fff;font:16px Arial;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<div id="status">Iniciando cámara…</div>

<a-scene
 mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: yes;"
 embedded
 vr-mode-ui="enabled: false"
 device-orientation-permission-ui="enabled: false"
 renderer="alpha:true; antialias:true; colorManagement:true">
 <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

 <a-entity id="bull" mindar-image-target="targetIndex:0">

   <!-- halos colocados sobre los ojos reales -->
   <a-ring id="eyeL" position="-0.174 -0.035 0.012" radius-inner="0.026" radius-outer="0.052"
     material="shader:flat;color:#ff19f7;transparent:true;opacity:.9"
     animation__pulse="property:scale;from:.72 .72 .72;to:1.35 1.35 1.35;dir:alternate;dur:320;loop:true;easing:easeInOutSine">
   </a-ring>
   <a-circle position="-0.174 -0.035 0.011" radius="0.025"
     material="shader:flat;color:#fff;transparent:true;opacity:.68"
     animation="property:material.opacity;from:.25;to:.9;dir:alternate;dur:220;loop:true"></a-circle>

   <a-ring id="eyeR" position="0.174 -0.035 0.012" radius-inner="0.026" radius-outer="0.052"
     material="shader:flat;color:#ff19f7;transparent:true;opacity:.9"
     animation__pulse="property:scale;from:.72 .72 .72;to:1.35 1.35 1.35;dir:alternate;dur:320;loop:true;easing:easeInOutSine">
   </a-ring>
   <a-circle position="0.174 -0.035 0.011" radius="0.025"
     material="shader:flat;color:#fff;transparent:true;opacity:.68"
     animation="property:material.opacity;from:.25;to:.9;dir:alternate;dur:220;loop:true"></a-circle>

   <!-- barras glitch -->
   <a-plane position="-0.31 0.22 0.018" width=".27" height=".012"
     material="shader:flat;color:#00ffff;transparent:true;opacity:.85"
     animation="property:position;from:-.36 .22 .018;to:-.18 .22 .018;dir:alternate;dur:120;loop:true"></a-plane>
   <a-plane position=".29 .13 .019" width=".31" height=".010"
     material="shader:flat;color:#ff00dd;transparent:true;opacity:.8"
     animation="property:position;from:.17 .13 .019;to:.37 .13 .019;dir:alternate;dur:155;loop:true"></a-plane>
   <a-plane position="-.25 -.23 .019" width=".22" height=".009"
     material="shader:flat;color:#2146ff;transparent:true;opacity:.85"
     animation="property:scale;from:.35 1 1;to:1.15 1 1;dir:alternate;dur:190;loop:true"></a-plane>

   <!-- energía/humo digital desde la nariz -->
   <a-circle position="-.065 -.245 .025" radius=".018"
     material="shader:flat;color:#00ffff;transparent:true;opacity:.65"
     animation__move="property:position;from:-.065 -.245 .025;to:-.12 -.39 .05;dur:900;loop:true"
     animation__fade="property:material.opacity;from:.7;to:0;dur:900;loop:true"
     animation__grow="property:scale;from:.4 .4 .4;to:2.4 2.4 2.4;dur:900;loop:true"></a-circle>
   <a-circle position=".065 -.245 .025" radius=".018"
     material="shader:flat;color:#ff00dd;transparent:true;opacity:.65"
     animation__move="property:position;from:.065 -.245 .025;to:.12 -.39 .05;dur:1050;loop:true"
     animation__fade="property:material.opacity;from:.7;to:0;dur:1050;loop:true"
     animation__grow="property:scale;from:.4 .4 .4;to:2.5 2.5 2.5;dur:1050;loop:true"></a-circle>

   <!-- elemento que sobresale del plano -->
   <a-ring position="0 -.06 .035" radius-inner=".40" radius-outer=".405"
     material="shader:flat;color:#00ffff;transparent:true;opacity:.45"
     animation="property:rotation;to:0 0 360;dur:4000;loop:true;easing:linear"
     animation__pulse="property:scale;from:.9 .9 .9;to:1.08 1.08 1.08;dir:alternate;dur:650;loop:true"></a-ring>
 </a-entity>
</a-scene>

<script>
const status=document.querySelector('#status');
const scene=document.querySelector('a-scene');
const bull=document.querySelector('#bull');
scene.addEventListener('arReady',()=>status.textContent='Buscando el toro…');
scene.addEventListener('arError',()=>status.textContent='Error de cámara');
bull.addEventListener('targetFound',()=>{
  status.textContent='✓ Toro detectado';
  setTimeout(()=>status.style.opacity='0',1200);
});
bull.addEventListener('targetLost',()=>{
  status.style.opacity='1';
  status.textContent='Buscando el toro…';
});
</script>
</body>
</html>
